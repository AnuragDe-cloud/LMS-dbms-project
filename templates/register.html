{% extends "base.html" %}{% block title %}Register · CampusLearn{% endblock %}{% block content %}
<div class="auth"><span class="tag">JOIN CAMPUSLEARN</span><h1>Create account</h1><p>Register as a student or instructor.</p><form method="post" class="form"><label>Full name<input name="full_name" required maxlength="100"></label><label>Email<input type="email" name="email" required maxlength="150"></label><label>Password<input type="password" name="password" minlength="8" required></label><label>Department<input name="department" value="Computer Science"></label><label>Role<select name="role"><option value="student">Student</option><option value="instructor">Instructor</option></select></label><button class="btn" type="submit">Create account</button></form><p>Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}
